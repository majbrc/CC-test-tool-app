[DEFINITION]
# Unique id of the file which can be referenced from the other files if needed
id=0001
# Short description of the file purpose - used for documenting purposes
description=SAP CC Acquisition process

[SETTINGS]
# how requests are to be sent
# singleRequest | separateRequest | groupByServiceId | groupByUserServiceId
# default: singleRequest
request.sendingMode=separateRequest

# ordering mode
# none - requests are ordered as listed in this file
# byConsumptionDateAsc - requests are ordered by consumption date - earliest consumption date sent first
# byConsumptionDateDesc - requests are ordered by consumption date - latest consumption date sent first
request.orderingMode=none

# Note: Acquisition requests shall not have empty string values
# Specify default values for string, number and date properties of the chargeable items
default.string.value=0
default.number.value=0
default.date.value=1970-01-01T00:00:00

[GENERAL]
# any section can hold some default values to be used in the INPUT sections
general.citdate=2023-11-06T11:35:42

[INPUT.001]
# acquire - trigger SAP CC acquisition process
# guiderLookup - (not supported) retrieve guiding lookup result
action=acquire
ci.definition=${TEST_INPUT/_TEST_COMMON_DIR}/common/catalog/MCIT.xml
serviceId=MOBILITY
userServiceId=${TEST_INPUT/USER_SERVICE_ID}
consumptionDate=${TEST_INPUT/CONSUMPTION_DATE_001}
p_CDR_RATED=N
p_GLOBAL_REFERENCE=aaaaa_aaaaaa_aaaaaaane
p_REQUEST_TYPE=F
p_MSC_ID=DUMMY_MSC_ID
p_PLMN=dummy_PLMN
p_CALLING_NUMBER=9000000000010
p_IMSI=AAAAA_AANG
p_LOCATION_ID=DUMMY_LOC_ID
p_BILLING_PARTY=90000000000000004
p_SUBR_NUMBER=aaaaa_aaaa_aaaanh
p_SOURCE_ID=IMS
p_CDR_CURRENCY=
p_FUP_CODE=N
p_IMEI=aaaaa_aanf
p_TADIG=LTUOM
p_TRANSACTION_TYPE=MOC
p_CALLED_NUMBER=90000000000000004
p_DURATION=18

