
[DEFINITION]
# Unique id of the file which can be referenced from the other files if needed
id=0001
# Short description of the file purpose - used for documenting purposes
description=SAP CC Acquisition process

[SETTINGS]
# how requests are to be sent
# singleRequest | separateRequest | groupByServiceId | groupByUserServiceId
# default: singleRequest
request.sendingMode=singleRequest

# ordering mode
# none - requests are ordered as listed in this file
# byConsumptionDateAsc - requests are ordered by consumption date - earliest consumption date sent first
# byConsumptionDateDesc - requests are ordered by consumption date - latest consumption date sent first
request.orderingMode=none

# Note: Acquisition requests shall not have empty string values
# Specify default values for string, number and date properties of the chargeable items
default.string.value= 
default.number.value=0
default.date.value=2026-05-30T11:35:42

[GENERAL]
