[DEFINITION]
# Unique id of the file which can be referenced from the other files if needed
id=telia_pgw_0003
# Short description of the session in this file - used for documenting purposes
description=Parallel pgw sessions
serviceType=pgw

[USERDATA]
serviceId=MOBILITY
userServiceId=${TEST_INPUT/USER_SERVICE_ID}

[SETTINGS]
ci.definition=${TEST_INPUT/_TEST_COMMON_DIR}/common/catalog/MCIT.xml

# possible values true if session contains multiple service streams (e.g. for data session different rating groups within the same session)
session.isMultiServiceSession=true
# in case of multiservice session this property will be used as reservation Id for the sub-sessions
session.multiServiceProperty=p_GLOBAL_REFERENCE

# The time to live (TTL) expressed in seconds
session.ttl=3600
# possible values CANCELLED and CONFIRMED
session.defaultResolution=CANCELLED
# name of the property for best effort reservation. Empty if no best effort reservation is used
session.propertyToInverse=

session.id=test-data-session-${USERDATA/userServiceId}

fw.onErrorFailTheTest=${TEST_INPUT/fwOnErrorFailTheTest}
fw.isOverspendingAllowed=false
fw.logTemplatePrefix=telia.${DEFINITION/serviceType}

[DEFAULTS]
@defaults_file=${TEST_INPUT/_TEST_DIR}/templates/telia.pgw.usage.defaults.ini
p_GLOBAL_REFERENCE=9000000000051

[EXTENSION]
# path to extension file which is used for the session validation or prerequisite setting
#testExtension=${TEST_INPUT/_TEST_DIR}/ext/01-data-session-validation.xml

[EXTREF]
# References to external sessions executed together together with this session
# Used for external dependencies
# e.g. reference to session definition file with id=0002
# extref.01.id=0002

[START.RSV.003]
consumptionDate=${TEST_INPUT/CURRENT_YEAR}-01-02T10:45:24
p_REQUEST_TYPE=R
p_SUBR_NUMBER=90000012
p_BILLING_PARTY=0684#GOOP
p_CDR_PRICE=9.99


[STOP.CFM.003]
consumptionDate=${TEST_INPUT/CURRENT_YEAR}-01-02T13:45:14
@confirmationFor=START.RSV.003
p_REQUEST_TYPE=C
p_SUBR_NUMBER=90000012
p_BILLING_PARTY=0684#GOOP
p_CDR_PRICE=9.99


#[CIT.0] # if no session.multiServiceProperty is defined
# when the session.multiServiceProperty is provided - use the exact value
[CIT.9000000000051] 
# the basic chargeable item is taken from the first reservation for the specified reservationId (0 or multiServiceProperty
# the overrides for the parameters can be given as exact values or as aggregation rules: @sum/@min/@max
# aggregation rules are applied on the confirmation chargeable items
# the consumption date is taken from the first reservation
# consumptionDate=${START.RSV.001/consumptionDate}