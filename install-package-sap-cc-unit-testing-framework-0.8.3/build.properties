# A) Framework data -----------------------------------------------------------
framework.jar.name=sap-cc-unit-testing-framework
framework.jar.version=0.8.3
framework.jar=sap-cc-unit-testing-framework-0.8.3.jar
framework.testng.listeners=hr.altima.fw.testng.listener.StdOutTestListener,hr.altima.fw.testng.listener.L01TestListener,hr.altima.fw.testng.reporter.L00TestReporter
framework.testng.single.method.listeners=hr.altima.fw.testng.listener.StdOutTestListener,hr.altima.fw.testng.listener.L01TestListener, hr.altima.fw.testng.reporter.L00TestReporter,hr.altima.fw.testng.custom.RunSingleMethod,hr.altima.fw.testng.custom.IgnoreMethodDependencies 

# B) Dependencies and dependency details --------------------------------------
# B.1 All dependencies are located in this directory, which is added to the classpath in build.xml
ext.lib.dir=${basedir}/install-package-sap-cc-unit-testing-framework-0.8.3/ext-libs
# B.2 testng library reference - it contains testng ant tasks
testng.lib.dir=${basedir}/install-package-sap-cc-unit-testing-framework-0.8.3/ext-libs
testng.lib.version=6.14.3
testng.lib.name=testng-${testng.lib.version}.jar
# B.3 JUL = Java Util Logging formatter library - used by build.xml to extract CSS files for test logs and reports
jul.formatter.lib.dir=${basedir}/install-package-sap-cc-unit-testing-framework-0.8.3/ext-libs
jul.formatter.lib.version=0.3
jul.formatter.lib.name=jul-formatter-${jul.formatter.lib.version}.jar
# B.4 Display frameworks
display.dir=install-package-sap-cc-unit-testing-framework-0.8.3/display

# C) Templates - must be relative to the position of build.xml !!!
templates.dir=${basedir}/install-package-sap-cc-unit-testing-framework-0.8.3/templates
# C.1 location of L0 and L1 test report templates
test.report.templates.dir=${templates.dir}/test-report
# C.2 location of the SOAP templates and SOAP request fragments used by the framework
framework.common.templates.dir=${templates.dir}/ws-common
# C.3 location of catalog definitions
framework.common.catalog.dir=${templates.dir}/catalog
# C.4 location of test-inputs dir (contains xsd files for template tests
framework.common.templates.test.inputs.dir=${templates.dir}/test-inputs
# C.5 location of xpath properties files (needed to parse XMLs returned by SAP CC)
framework.common.xpath.dir=${templates.dir}/xpath
#C.6 location of session FSM test log templates
framework.test.log.templates.dir=${templates.dir}/test-log

# D) Test execution and logging configuration
# D.1 configDirPath - system property path to the main config file which points out SAP CC landscape
test.config.dir.path=${basedir}/install-package-sap-cc-unit-testing-framework-0.8.3/config
# D.2 testLogDir - system property to configure basic directory where test log files are created
test.log.dir.path=${basedir}/target/antrun/logs
# D.3 createClassSubDirForLogs - system property which indicates that for each test class logs are set in separate dir with class nema; this directory is created under test.log.dir.path
test.log.create.class.subdir=false
# D.4 testTemplateInput - system property which indicates where the inputs for template test is located - it has to include the exact file name
test.input.template=${basedir}/install-package-sap-cc-unit-testing-framework-0.8.3/some-test-template.xml
# D.5 directory where test reports and logs are written
testng.report.dir=${test.log.dir.path}/${user.name}
# D.6 console log level - used for framework and test setup debugging purposes. Allowed values are: OFF|SEVERE|WARNING|INFO|CONFIG|FINE|FINER|FINEST|ALL
test.console.logger.level=WARNING
#D.7 framewok jar classpath
test.framework.jar.classpath=install-package-sap-cc-unit-testing-framework-0.8.3/${framework.jar}

# E) Inputs for java compiled tests - CURRENTLY NOT USED
# Test jar data
test.jar.name=hteronet-test-suite
test.jar.version=0.1
test.jar.dir=${basedir}
test.jar=${test.jar.name}-v${test.jar.version}.jar